name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: warp-cam-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing SIGNING_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing SIGNING_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing SIGNING_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing SIGNING_KEY_PASSWORD" && exit 1)
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .signing
          echo "$KEYSTORE_B64" | base64 --decode > .signing/warp-cam-release.jks
          test -s .signing/warp-cam-release.jks
      - name: Build signed release APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/.signing/warp-cam-release.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK exists and is signed
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          TOOL="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$TOOL"
          "$TOOL" verify --verbose --print-certs "$APK"
          cp "$APK" warp-cam-release.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" warp-cam-release.apk \
            --title "WARP CAM ${GITHUB_REF_NAME}" \
            --generate-notes
