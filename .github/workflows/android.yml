name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  WARP_STORE_PASSWORD: warp-cam-release
  WARP_KEY_ALIAS: warp-cam
  WARP_KEY_PASSWORD: warp-cam-release

jobs:
  verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Restore fixed personal release keystore
        run: |
          mkdir -p .signing
          base64 --decode signing/warp-cam-release.jks.b64 > .signing/warp-cam-release.jks
          test -s .signing/warp-cam-release.jks
      - name: Build signed release APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/.signing/warp-cam-release.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ env.WARP_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ env.WARP_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ env.WARP_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify signed APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          TOOL="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$TOOL"
          "$TOOL" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: warp-cam-release
          path: app/build/outputs/apk/release/app-release.apk

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Restore fixed personal release keystore
        run: |
          mkdir -p .signing
          base64 --decode signing/warp-cam-release.jks.b64 > .signing/warp-cam-release.jks
          test -s .signing/warp-cam-release.jks
      - name: Build signed release APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/.signing/warp-cam-release.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ env.WARP_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ env.WARP_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ env.WARP_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK exists and is signed
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          TOOL="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$TOOL"
          "$TOOL" verify --verbose --print-certs "$APK"
          cp "$APK" warp-cam-release.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" warp-cam-release.apk \
            --title "WARP CAM ${GITHUB_REF_NAME}" \
            --generate-notes
